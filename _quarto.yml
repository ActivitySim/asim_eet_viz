project:
  type: book
  output-dir: "output"

sources:
  affected_zones: "~/Desktop/activitysim/11c_files/inputs/transit_corridor/transit_zones_affected.csv"
  base: "~/Desktop/activitysim/11c_files/output/output-base-mc/"
  build: "~/Desktop/activitysim/11c_files/output/output-transit-mc/"
  how_method: all # Employment -> any, Transit -> all
  file_format: parquet # csv or parquet

  notebooks:
  - long_term.ipynb
  - daily.ipynb
  - joint.ipynb
  - tours.ipynb
  - trips.ipynb

book:
  title: "ActivitySim Base-Build Comparison Visualization"
  repo-url: https://github.com/ActivitySim/asim_eet_viz
  search: false

  chapters:
    - index.qmd

number-sections: true
format:
  html:
    mainfont: sans-serif
    fontsize: "7"
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    echo: false
    code-tools: true
    # output-file: visualization
    embed-resources: false
toc: true
warning: false
